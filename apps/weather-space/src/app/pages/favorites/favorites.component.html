<main>
  @if (hasFavorites()){

    @for (item of items() | keyvalue; track item) {
      <div class="favorite-card-wrapper">
        <weather-space-favorite-card
          [item]="item.value"
          [metric]="isMetric()"
          (selectionChanged)="onSelectionChanged($event)"
        ></weather-space-favorite-card>
      </div>
    }
  } @else {
    <section>
      <p>No favorites has been selected</p>
    </section>
  }
</main>
